name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests only need the retrieval code, not Ollama or the embedding model.
      - run: pip install pytest "sqlalchemy==2.0.*"
      - run: python -m pytest -q tests
